services:
  # Web service for Novustell Travel
  - type: web
    name: novustellke
    env: python
    region: oregon
    plan: starter
    branch: novustell4
    buildCommand: |
      echo "🚀 Starting Novustell Travel build process..."
      pip install --upgrade pip
      pip install -r requirements.txt
      echo "📦 Dependencies installed successfully"
      python manage.py collectstatic --noinput --settings=tours_travels.settings_prod
      echo "📁 Static files collected"
      python manage.py migrate --settings=tours_travels.settings_prod
      echo "🗄️ Database migrations applied"
      python manage.py createcachetable --settings=tours_travels.settings_prod
      echo "💾 Cache table created"
      echo "✅ Build completed successfully"
    startCommand: |
      echo "🌟 Starting Novustell Travel web server..."
      gunicorn tours_travels.wsgi:application \
        --bind 0.0.0.0:$PORT \
        --workers $WEB_CONCURRENCY \
        --timeout $GUNICORN_TIMEOUT \
        --worker-class sync \
        --worker-connections 1000 \
        --max-requests 1000 \
        --max-requests-jitter 100 \
        --preload \
        --access-logfile - \
        --error-logfile - \
        --log-level info
    envVars:
      # Django Core Configuration
      - key: DJANGO_SETTINGS_MODULE
        value: tours_travels.settings_prod
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: novustelltravel.onrender.com,.onrender.com,novustelltravel.com,www.novustelltravel.com

      # Database Configuration
      - key: DATABASE_URL
        fromDatabase:
          name: novustell-db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: 600
      - key: DB_CONN_HEALTH_CHECKS
        value: True

      # Server Configuration
      - key: PORT
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 3
      - key: GUNICORN_WORKERS
        value: 3
      - key: GUNICORN_TIMEOUT
        value: 120
      - key: RENDER_EXTERNAL_HOSTNAME
        generateValue: true

      # Email Configuration - Mailtrap HTTP API
      - key: MAILTRAP_API_TOKEN
        value: d766975d57a7ef1acf2f750a36247a37
      - key: EMAIL_HOST_USER
        value: api
      - key: EMAIL_HOST_PASSWORD
        value: d766975d57a7ef1acf2f750a36247a37

      # Celery Configuration for Email Marketing
      - key: CELERY_BROKER_URL
        value: rediss://default:AWAXAAIncDI4ZTNlNjRkMDEyOWI0OTdkODI4Nzk0ZTZlMTc1ZmQxOXAyMjQ1OTk@popular-condor-24599.upstash.io:6379
      - key: CELERY_RESULT_BACKEND
        value: rediss://default:AWAXAAIncDI4ZTNlNjRkMDEyOWI0OTdkODI4Nzk0ZTZlMTc1ZmQxOXAyMjQ1OTk@popular-condor-24599.upstash.io:6379
      - key: EMAIL_RATE_LIMIT_PER_MINUTE
        value: 60
      - key: EMAIL_RATE_LIMIT_PER_HOUR
        value: 1000

      - key: DEFAULT_FROM_EMAIL
        value: Novustell Travel <info@novustelltravel.com>
      - key: ADMIN_EMAIL
        value: info@novustelltravel.com
      - key: JOBS_EMAIL
        value: careers@novustelltravel.com
      - key: NEWSLETTER_EMAIL
        value: news@novustelltravel.com

      # Uploadcare Configuration
      - key: UPLOADCARE_PUBLIC_KEY
        sync: false  # Set manually in Render dashboard
      - key: UPLOADCARE_SECRET_KEY
        sync: false  # Set manually in Render dashboard

      # Site Configuration
      - key: SITE_URL
        value: https://wwww.novustelltravel.com
      - key: WHATSAPP_PHONE
        value: +254701363551

      # Security Configuration
      - key: SECURE_SSL_REDIRECT
        value: True
      - key: SECURE_HSTS_SECONDS
        value: 31536000
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: True
      - key: SECURE_HSTS_PRELOAD
        value: True
      - key: SESSION_COOKIE_SECURE
        value: True
      - key: CSRF_COOKIE_SECURE
        value: True
      - key: SESSION_COOKIE_HTTPONLY
        value: True
      - key: CSRF_COOKIE_HTTPONLY
        value: True

      # Performance Configuration
      - key: FILE_UPLOAD_MAX_MEMORY_SIZE
        value: 5242880
      - key: DATA_UPLOAD_MAX_MEMORY_SIZE
        value: 5242880
      - key: SESSION_COOKIE_AGE
        value: 86400

      # Feature Flags
      - key: ENABLE_BOOKING_NOTIFICATIONS
        value: True
      - key: ENABLE_EMAIL_MARKETING
        value: True
      - key: ENABLE_ANALYTICS
        value: True
      - key: ENABLE_CHAT_SUPPORT
        value: False

      # Business Configuration
      - key: DEFAULT_BOOKING_EXPIRY_HOURS
        value: 24
      - key: MAX_BOOKING_ADULTS
        value: 20
      - key: MAX_BOOKING_CHILDREN
        value: 15
      - key: MAX_BOOKING_ROOMS
        value: 10

      # Regional Settings
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: DEFAULT_LANGUAGE
        value: en
      - key: DEFAULT_COUNTRY
        value: Kenya
      - key: DEFAULT_CURRENCY
        value: USD

      # Monitoring (Optional - set manually if needed)
      # - key: SENTRY_DSN
      #   sync: false
      # - key: GOOGLE_ANALYTICS_ID
      #   sync: false

    healthCheckPath: /health/
    autoDeploy: true
    disk:
      name: novustell-disk
      mountPath: /opt/render/project/src/media
      sizeGB: 1

  # Celery Worker for Email Marketing Background Tasks
  - type: worker
    name: novustell-celery-worker
    env: python
    region: oregon
    plan: starter
    branch: novustell4
    buildCommand: |
      echo "🔧 Building Celery worker for email marketing..."
      pip install --upgrade pip
      pip install -r requirements.txt
      echo "✅ Celery worker build completed"
    startCommand: |
      echo "⚡ Starting Celery worker for email campaigns..."
      celery -A tours_travels worker --loglevel=info --concurrency=2 --queues=email_marketing,celery
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: tours_travels.settings_prod
      - key: DATABASE_URL
        fromDatabase:
          name: novustell-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: novustellke
          envVarKey: SECRET_KEY
      - key: MAILTRAP_API_TOKEN
        value: d766975d57a7ef1acf2f750a36247a37
      - key: CELERY_BROKER_URL
        value: rediss://default:AWAXAAIncDI4ZTNlNjRkMDEyOWI0OTdkODI4Nzk0ZTZlMTc1ZmQxOXAyMjQ1OTk@popular-condor-24599.upstash.io:6379
      - key: CELERY_RESULT_BACKEND
        value: rediss://default:AWAXAAIncDI4ZTNlNjRkMDEyOWI0OTdkODI4Nzk0ZTZlMTc1ZmQxOXAyMjQ1OTk@popular-condor-24599.upstash.io:6379
      - key: EMAIL_RATE_LIMIT_PER_MINUTE
        value: 60
      - key: EMAIL_RATE_LIMIT_PER_HOUR
        value: 1000
      - key: ADMIN_EMAIL
        value: info@novustelltravel.com
      - key: JOBS_EMAIL
        value: careers@novustelltravel.com
      - key: NEWSLETTER_EMAIL
        value: news@novustelltravel.com
      - key: TIME_ZONE
        value: Africa/Nairobi
    autoDeploy: true

  # Celery Beat for Scheduled Email Campaigns
  - type: worker
    name: novustell-celery-beat
    env: python
    region: oregon
    plan: starter
    branch: novustell4
    buildCommand: |
      echo "🔧 Building Celery beat scheduler..."
      pip install --upgrade pip
      pip install -r requirements.txt
      echo "✅ Celery beat build completed"
    startCommand: |
      echo "⏰ Starting Celery beat for scheduled campaigns..."
      celery -A tours_travels beat --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: tours_travels.settings_prod
      - key: DATABASE_URL
        fromDatabase:
          name: novustell-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: novustellke
          envVarKey: SECRET_KEY
      - key: CELERY_BROKER_URL
        value: rediss://default:AWAXAAIncDI4ZTNlNjRkMDEyOWI0OTdkODI4Nzk0ZTZlMTc1ZmQxOXAyMjQ1OTk@popular-condor-24599.upstash.io:6379
      - key: CELERY_RESULT_BACKEND
        value: rediss://default:AWAXAAIncDI4ZTNlNjRkMDEyOWI0OTdkODI4Nzk0ZTZlMTc1ZmQxOXAyMjQ1OTk@popular-condor-24599.upstash.io:6379
      - key: TIME_ZONE
        value: Africa/Nairobi
    autoDeploy: true

databases:
  # NeonDB PostgreSQL database
  - name: novustell-db
    databaseName: novustell_travel
    user: novustell_user
    region: oregon
    plan: free
    postgresMajorVersion: 15
    ipAllowList: []  # Allow all IPs (can be restricted later)

# Redis cache (optional - for improved performance)
# - name: novustell-redis
#   type: redis
#   region: oregon
#   plan: free
#   maxmemoryPolicy: allkeys-lru

# Static files and media configuration
# Note: Render serves static files automatically
# For production media files, consider AWS S3 integration

# Environment-specific notes:
# 1. Set MAILTRAP_API_TOKEN manually in Render dashboard:d766975d57a7ef1acf2f750a36247a37
# 2. Set UPLOADCARE_PUBLIC_KEY and UPLOADCARE_SECRET_KEY manually
# 3. Optional: Set SENTRY_DSN for error monitoring
# 4. Optional: Set GOOGLE_ANALYTICS_ID for analytics
# 5. Consider upgrading to paid plans for production workloads

# Deployment checklist:
# ✅ Environment variables configured
# ✅ Database connection established
# ✅ Static files collection enabled
# ✅ Health checks configured
# ✅ Auto-deployment enabled
# ✅ Security headers configured
# ✅ Performance optimizations applied
